name: Waypoints
options:
  bundleIdPrefix: com.waypoints
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  defaultConfig: Release
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Waypoints:
    type: application
    platform: iOS
    sources:
      - path: Waypoints
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waypoints.atlas
        PRODUCT_NAME: Waypoints
        INFOPLIST_FILE: Waypoints/Info.plist
        CODE_SIGN_ENTITLEMENTS: Waypoints/Entitlements/Waypoints.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: WaypointsShare
      - target: WaypointsWidget
    frameworks:
      - framework: SwiftData.framework
      - framework: RealityKit.framework
      - framework: SceneKit.framework
      - framework: Vision.framework
      - framework: NaturalLanguage.framework
      - framework: PhotosUI.framework
      - framework: UniformTypeIdentifiers.framework
      - framework: CoreLocation.framework
      - framework: AppIntents.framework
      - framework: WidgetKit.framework
      - framework: ImageIO.framework
      - framework: CloudKit.framework

  WaypointsShare:
    type: app-extension
    platform: iOS
    sources:
      - path: WaypointsShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waypoints.atlas.ShareExtension
        PRODUCT_NAME: WaypointsShare
        INFOPLIST_FILE: WaypointsShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: WaypointsShare/Entitlements/WaypointsShare.entitlements
    frameworks:
      - framework: UniformTypeIdentifiers.framework
      - framework: Social.framework

  WaypointsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WaypointsWidget
      - path: Waypoints/Services/Widgets/WidgetSnapshotService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waypoints.atlas.WidgetExtension
        PRODUCT_NAME: WaypointsWidget
        INFOPLIST_FILE: WaypointsWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WaypointsWidget/Entitlements/WaypointsWidget.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
    frameworks:
      - framework: WidgetKit.framework
      - framework: SwiftUI.framework

schemes:
  Waypoints:
    build:
      targets:
        Waypoints: all
        WaypointsShare: all
        WaypointsWidget: all
    run:
      config: Debug
    archive:
      config: Release
