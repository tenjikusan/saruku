name: Native iOS Build & Test

on:
  push:
    branches: [ main, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, 'feature/**', 'release/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test on macOS
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version & Verify Simulators
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version
          echo "=== Available iOS Simulators ==="
          xcrun simctl list devices available


      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build All Targets (iOS Simulator Unsigned)
        run: |
          xcodebuild build \
            -project Waypoints.xcodeproj \
            -scheme Waypoints \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit & Integration Tests (iOS Simulator)
        run: |
          xcodebuild test \
            -project Waypoints.xcodeproj \
            -scheme Waypoints \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Waypoints-Test-Results
          path: TestResults.xcresult
