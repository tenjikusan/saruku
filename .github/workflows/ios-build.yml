name: Native iOS Build & Test

on:
  push:
    branches: [ main, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, 'feature/**', 'release/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect & Select Installed Xcode Version
        run: |
          echo "=== Installed Xcode Applications ==="
          ls -la /Applications/Xcode* 2>/dev/null || true
          
          # Pick the latest installed Xcode release on the runner
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          
          echo "=== Active Xcode Version ==="
          xcodebuild -version
          
          echo "=== Available iOS Simulators ==="
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build All Targets (iOS Simulator Unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Waypoints.xcodeproj \
            -scheme Waypoints \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Detect Available iPhone Simulator & Run Tests
        run: |
          set -o pipefail
          # Find any available iPhone simulator installed in the runtime
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/^[[:space:]]*([^(]+)[[:space:]]*\(.*/\1/' | xargs || echo "iPhone 15")
          echo "Targeting simulator: $SIM_NAME"
          
          xcodebuild test \
            -project Waypoints.xcodeproj \
            -scheme Waypoints \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            | tee test.log

      - name: Upload Build & Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Waypoints-Build-And-Test-Logs
          path: |
            build.log
            test.log

      - name: Upload Test Results Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Waypoints-Test-Results-xcresult
          path: TestResults.xcresult
