name: Native iOS Build & Test

on:
  push:
    branches: [ main, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, 'feature/**', 'release/**' ]
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (e.g. macos-latest, macos-14, macos-15)'
        required: false
        default: 'macos-latest'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test on macOS
    runs-on: ${{ inputs.runner_label || 'macos-latest' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect & Select Installed Xcode Version
        run: |
          echo "=== Active Developer Directory ==="
          xcode-select -p || true

          echo "=== Installed Xcode Applications ==="
          for xc in /Applications/Xcode*.app; do
            if [ -d "$xc" ]; then
              echo "Found: $xc"
            fi
          done

          # Automatically select highest installed Xcode version
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -d "$LATEST_XCODE" ]; then
            echo "Selecting highest detected Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi

          echo "=== Active Xcode Version & Build Toolchain ==="
          xcodebuild -version

          echo "=== Available iOS Simulators ==="
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build All Targets (iOS Simulator Unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Waypoints.xcodeproj \
            -scheme Waypoints \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Detect Available iPhone Simulator & Run Tests
        run: |
          set -o pipefail
          # Robust POSIX-compliant simulator detection across macOS versions
          SIM_UUID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/' || true)
          if [ -n "$SIM_UUID" ] && [ "$SIM_UUID" != "" ]; then
            echo "Selected Simulator UDID: $SIM_UUID"
            DESTINATION="platform=iOS Simulator,id=$SIM_UUID"
          else
            echo "Falling back to named simulator destination"
            DESTINATION="platform=iOS Simulator,name=iPhone 15"
          fi
          echo "Testing with destination: $DESTINATION"

          xcodebuild test \
            -project Waypoints.xcodeproj \
            -scheme Waypoints \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            | tee test.log

      - name: Upload Build & Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Waypoints-Build-And-Test-Logs
          path: |
            build.log
            test.log

      - name: Upload Test Results Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Waypoints-Test-Results-xcresult
          path: TestResults.xcresult
