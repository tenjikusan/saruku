name: TestFlight Distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      buildNumber:
        description: 'Build Number (e.g. 1)'
        required: true
        default: '1'

jobs:
  distribute-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Verify Distribution Prerequisites
        run: |
          echo "Checking Apple Developer and App Store Connect secrets..."
          if [ -z "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" ] || [ -z "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ]; then
            echo "::warning ::App Store Connect API credentials are not yet configured in GitHub Secrets."
            echo "To complete TestFlight distribution, add the required secrets described in Docs/RELEASE_READINESS.md."
          fi

      - name: Archive App (Release)
        run: |
          xcodebuild archive \
            -project Waypoints.xcodeproj \
            -scheme Waypoints \
            -configuration Release \
            -archivePath build/Waypoints.xcarchive \
            MARKETING_VERSION="${{ github.event.inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.event.inputs.buildNumber }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waypoints-Archive-${{ github.event.inputs.version }}-b${{ github.event.inputs.buildNumber }}
          path: build/Waypoints.xcarchive
